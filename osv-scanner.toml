# Advisories the daily scan (.github/workflows/security.yml) accepts, so that it fails only on new ones.
# Every entry needs a reason and expires on its review date: after ignoreUntil the advisory counts again,
# and the scan fails until someone looks at it again and moves the date or fixes it.
# Only advisories with no fixed version, or that do not reach what FreeChat ships, belong here.

# Rust crates that are no longer maintained. They have no known vulnerability and no fixed release;
# upstream accepts them too (matrix-rust-sdk .deny.toml, tuwunel .cargo/audit.toml).

[[IgnoredVulns]]
id = "RUSTSEC-2024-0449"
ignoreUntil = 2027-02-25
reason = "unsafe-libyaml is unmaintained, no fix; Tuwunel (serde_yaml) reads only its own config with it. Tuwunel ignores it."

[[IgnoredVulns]]
