# Builds the FreeChat images from upstream baselines + patches and publishes them to ghcr.io:
#   ghcr.io/<owner>/freechat-server
#   ghcr.io/<owner>/freechat-web
# Public repos get linux/amd64 and linux/arm64. Private repos (such as a private fork) get linux/amd64
# only, because GitHub's free arm64 runners serve public repos only.
name: images

on:
  push:
    branches: [main]
    # Only what goes into the images: the server and web patches, the build files, the branding the web
    # image applies, and install.sh, whose CSP the web build checks.
    paths:
      - upstream.conf
      - patches/tuwunel/**
      - patches/element-web/**
      - docker/**
      - branding/**
      - deploy/install.sh
      - .github/workflows/images.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: images
  cancel-in-progress: false

jobs:
  meta:
    runs-on: ubuntu-24.04
    outputs:
      owner: ${{ steps.meta.outputs.owner }}
      version: ${{ steps.meta.outputs.version }}
      server_matrix: ${{ steps.meta.outputs.server_matrix }}
      web_platforms: ${{ steps.meta.outputs.web_platforms }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: meta
        run: |
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          # e.g. 2026.10.18-a1b2c3d
          echo "version=$(date -u +%Y.%m.%d)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event.repository.private }}" = "true" ]; then
            echo 'server_matrix={"include":[{"platform":"linux/amd64","runner":"ubuntu-24.04"}]}' >> "$GITHUB_OUTPUT"
            echo "web_platforms=linux/amd64" >> "$GITHUB_OUTPUT"
          else
            echo 'server_matrix={"include":[{"platform":"linux/amd64","runner":"ubuntu-24.04"},{"platform":"linux/arm64","runner":"ubuntu-24.04-arm"}]}' >> "$GITHUB_OUTPUT"
            echo "web_platforms=linux/amd64,linux/arm64" >> "$GITHUB_OUTPUT"
          fi

  server:
    needs: meta
    strategy:
      matrix: ${{ fromJSON(needs.meta.outputs.server_matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/server.Dockerfile
          platforms: ${{ matrix.platform }}
          cache-from: type=gha,scope=server-${{ matrix.runner }}
          cache-to: type=gha,mode=max,scope=server-${{ matrix.runner }}
          outputs: type=image,name=ghcr.io/${{ needs.meta.outputs.owner }}/freechat-server,push-by-digest=true,name-canonical=true,push=true
      - run: |
          mkdir -p /tmp/digests
          echo "${{ steps.build.outputs.digest }}" > "/tmp/digests/${{ matrix.runner }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: server-digest-${{ matrix.runner }}
          path: /tmp/digests/*

  server-manifest:
    needs: [meta, server]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: server-digest-*
          merge-multiple: true
          path: /tmp/digests
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          image=ghcr.io/${{ needs.meta.outputs.owner }}/freechat-server
          # The digests are meant to split into one argument each.
          # shellcheck disable=SC2046
          docker buildx imagetools create \
            -t "$image:latest" -t "$image:${{ needs.meta.outputs.version }}" \
            $(for f in /tmp/digests/*; do echo "$image@$(cat "$f")"; done)

  web:
    needs: meta
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/web.Dockerfile
          platforms: ${{ needs.meta.outputs.web_platforms }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
          push: true
          tags: |
            ghcr.io/${{ needs.meta.outputs.owner }}/freechat-web:latest
            ghcr.io/${{ needs.meta.outputs.owner }}/freechat-web:${{ needs.meta.outputs.version }}
