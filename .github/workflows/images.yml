# Builds the FreeChat images from upstream baselines + patches and publishes them to ghcr.io:
#   ghcr.io/<owner>/freechat-server
#   ghcr.io/<owner>/freechat-web
# Public repos get linux/amd64 and linux/arm64. Private repos (such as a private fork) get linux/amd64
# only, because GitHub's free arm64 runners serve public repos only.
name: images

on:
  push:
    branches: [main]
    paths: [upstream.conf, patches/**, docker/**, .github/workflows/images.yml]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: images
  cancel-in-progress: false

jobs:
  meta:
    runs-on: ubuntu-24.04
    outputs:
      owner: ${{ steps.meta.outputs.owner }}
      version: ${{ steps.meta.outputs.version }}
      server_matrix: ${{ steps.meta.outputs.server_matrix }}
      web_platforms: ${{ steps.meta.outputs.web_platforms }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - id: meta
        run: |
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          # e.g. 2026.10.18-a1b2c3d
          echo "version=$(date -u +%Y.%m.%d)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event.repository.private }}" = "true" ]; then
            echo 'server_matrix={"include":[{"platform":"linux/amd64","runner":"ubuntu-24.04"}]}' >> "$GITHUB_OUTPUT"
            echo "web_platforms=linux/amd64" >> "$GITHUB_OUTPUT"
          else
            echo 'server_matrix={"include":[{"platform":"linux/amd64","runner":"ubuntu-24.04"},{"platform":"linux/arm64","runner":"ubuntu-24.04-arm"}]}' >> "$GITHUB_OUTPUT"
            echo "web_platforms=linux/amd64,linux/arm64" >> "$GITHUB_OUTPUT"
          fi

  server:
    needs: meta
    strategy:
      matrix: ${{ fromJSON(needs.meta.outputs.server_matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: docker/server.Dockerfile
          platforms: ${{ matrix.platform }}
          cache-from: type=gha,scope=server-${{ matrix.runner }}
          cache-to: type=gha,mode=max,scope=server-${{ matrix.runner }}
          outputs: type=image,name=ghcr.io/${{ needs.meta.outputs.owner }}/freechat-server,push-by-digest=true,name-canonical=true,push=true
      - run: |
          mkdir -p /tmp/digests
          echo "${{ steps.build.outputs.digest }}" > "/tmp/digests/${{ matrix.runner }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: server-digest-${{ matrix.runner }}
          path: /tmp/digests/*

  server-manifest:
    needs: [meta, server]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: server-digest-*
          merge-multiple: true
          path: /tmp/digests
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          image=ghcr.io/${{ needs.meta.outputs.owner }}/freechat-server
          docker buildx imagetools create \
            -t "$image:latest" -t "$image:${{ needs.meta.outputs.version }}" \
            $(for f in /tmp/digests/*; do echo "$image@$(cat "$f")"; done)

  web:
    needs: meta
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: docker/web.Dockerfile
          platforms: ${{ needs.meta.outputs.web_platforms }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
          push: true
          tags: |
            ghcr.io/${{ needs.meta.outputs.owner }}/freechat-web:latest
            ghcr.io/${{ needs.meta.outputs.owner }}/freechat-web:${{ needs.meta.outputs.version }}
