# Regenerates Element Web's pnpm lockfile on GitHub's network, for dependency updates:
#   gh workflow run web-lockfile.yml -f diff="$(git -C forks/element-web diff)"
# It checks out Element Web with the FreeChat patches, applies the given diff (package.json,
# pnpm-workspace.yaml), updates pnpm-lock.yaml and uploads the whole change as the artifact
# web-deps.diff, to review and apply to forks/element-web.
name: web-lockfile

on:
  workflow_dispatch:
    inputs:
      diff:
        description: git diff to apply to the patched Element Web first
        required: false
        default: ""

permissions:
  contents: read

jobs:
  lockfile:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Check out Element Web with the FreeChat patches
        run: docker/checkout.sh element-web forks/element-web

      - name: Apply the changes
        if: inputs.diff != ''
        working-directory: forks/element-web
        env:
          DIFF: ${{ inputs.diff }}
        run: printf '%s\n' "$DIFF" | git apply --verbose

      - name: Update the lockfile
        working-directory: forks/element-web
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
        run: |
          corepack enable
          pnpm install --lockfile-only --ignore-scripts
          git diff --stat
          git diff > "$GITHUB_WORKSPACE/web-deps.diff"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-deps.diff
          path: web-deps.diff
          retention-days: 7
