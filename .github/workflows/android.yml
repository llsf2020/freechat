# Builds FreeChat for Android from the upstream baseline + patches.
#   sdk:   FreeChat's Rust SDK (matrix-rust-sdk + patches/matrix-rust-sdk) for arm64, through
#          dev/build-rust-sdk.sh. Cached: it is only rebuilt when the SDK baseline or its patches change.
#   build: the unit tests of every module the FreeChat patches touch, then the F-Droid debug APK (no Google
#          services) for arm64, using that SDK, kept as the freechat-android-debug artifact.
# Debug builds are signed with the public debug key; release signing needs a keystore in repository secrets
# and is not part of this workflow.
name: android

on:
  push:
    branches: [main]
    paths:
      - upstream.conf
      - patches/element-x-android/**
      - patches/matrix-rust-sdk/**
      - branding/**
      - docker/checkout.sh
      - dev/build-android.sh
      - dev/build-rust-sdk.sh
      - .github/workflows/android.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android
  cancel-in-progress: true

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx7g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8" -Dkotlin.daemon.jvm.options=-Xmx2g -XX:+UseG1GC

jobs:
  sdk:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      # The NDK that upstream's matrix-rust-components-kotlin builds with.
      NDK_VERSION: 28.2.13676358
      CARGO_NDK_VERSION: 4.1.2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Everything the SDK build reads: its baseline, the packaging tool's baseline, the patches and the script.
      - name: Cache key
        id: key
        run: |
          key=$( { grep -E '^matrix-rust-(sdk|components-kotlin) ' upstream.conf; cat patches/matrix-rust-sdk/*.patch 2>/dev/null; cat dev/build-rust-sdk.sh; } | sha256sum | cut -c1-20)
          echo "key=rust-sdk-android-$key" >> "$GITHUB_OUTPUT"

      - id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: rust-sdk/matrix-rust-sdk.aar
          key: ${{ steps.key.outputs.key }}

      - name: Free disk space
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force > /dev/null
          df -h /

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          distribution: temurin
          java-version: "17"

      - name: Rust, cargo-ndk, protoc and the NDK
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          rustup toolchain install stable --profile minimal --target aarch64-linux-android
          rustup default stable
          cargo install cargo-ndk --locked --version "$CARGO_NDK_VERSION"
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends protobuf-compiler
          ndk="$ANDROID_HOME/ndk/$NDK_VERSION"
          [ -d "$ndk" ] || "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" > /dev/null
          [ -d "$ndk" ] || { echo "NDK $NDK_VERSION did not install"; exit 1; }
          echo "ANDROID_NDK_HOME=$ndk" >> "$GITHUB_ENV"

      - name: Build the Rust SDK
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p rust-sdk
          dev/build-rust-sdk.sh android rust-sdk/matrix-rust-sdk.aar

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          path: rust-sdk/matrix-rust-sdk.aar
          key: ${{ steps.key.outputs.key }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-sdk-android
          path: rust-sdk/matrix-rust-sdk.aar
          retention-days: 3
          if-no-files-found: error

  build:
    needs: sdk
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force > /dev/null
          df -h /

      # The build gets terminated when memory runs out (as upstream's CI found too), so add swap.
      - name: More swap
        run: |
          sudo swapoff -a
          sudo fallocate -l 8G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile > /dev/null
          sudo swapon /mnt/swapfile
          free -h

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Check out Element X Android with the FreeChat patches
        run: |
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends python3-pil
          # Upstream keeps some assets in Git LFS; with this the clone fetches them.
          git lfs install
          docker/checkout.sh element-x-android forks/element-x-android

      # Debug builds use libraries/rustsdk/matrix-rust-sdk.aar instead of the published SDK when it exists.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rust-sdk-android
          path: forks/element-x-android/libraries/rustsdk

      - name: Unit tests and debug APK
        run: |
          dev/build-android.sh \
            :appnav:testDebugUnitTest \
            :features:joinroom:impl:testDebugUnitTest \
            :features:messages:impl:testDebugUnitTest \
            :features:preferences:impl:testDebugUnitTest \
            :features:roomdetails:impl:testDebugUnitTest \
            :libraries:eventformatter:impl:testDebugUnitTest \
            :libraries:matrix:api:testDebugUnitTest \
            :libraries:matrix:impl:testDebugUnitTest \
            :libraries:matrixui:testDebugUnitTest \
            :libraries:preferences:impl:testDebugUnitTest \
            :libraries:push:impl:testDebugUnitTest \
            :libraries:pushproviders:unifiedpush:testDebugUnitTest \
            :libraries:pushstore:impl:testDebugUnitTest \
            :libraries:session-storage:impl:testDebugUnitTest \
            :app:assembleFdroidDebug \
            --stacktrace --no-configuration-cache

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: freechat-android-debug
          # The SDK is built for arm64 only, so only the arm64 APK has it.
          path: forks/element-x-android/app/build/outputs/apk/fdroid/debug/*arm64-v8a*.apk
          retention-days: 14
          if-no-files-found: error

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: android-test-reports
          path: forks/element-x-android/**/build/reports/tests/
          retention-days: 7
          if-no-files-found: ignore
