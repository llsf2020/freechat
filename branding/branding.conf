# FreeChat branding. After editing, run branding/apply.py and rebuild the apps.
# See branding/README.md.

# Name the apps show (home screen, browser tab)
APP_NAME=FreeChat

# Android application ID. Don't change it once people have installed the app: it would count as a
# different app and everyone would have to reinstall.
ANDROID_APP_ID=chat.freechat.app

# iOS bundle ID (must match the one registered with Apple)
IOS_BUNDLE_ID=chat.freechat.app

# Icon background colour (Android adaptive icon background, also used for the iOS and web icons)
ICON_BACKGROUND=#12805C

# Web theme colour (the address bar colour in mobile browsers)
THEME_COLOR=#12805C
