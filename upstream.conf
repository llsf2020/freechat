# FreeChat upstream components (machine-readable; scripts/upstream.sh reads and writes it)
#
# Columns: name  upstream repository  baseline (tag)  FreeChat branch  status  baseline commit
#   status: modified   = has FreeChat changes; the freechat branch of forks/<name> = baseline + our commits
#           planned    = changes planned, not forked yet
#           unmodified = official release used as is; only the version is recorded
#   baseline commit: full commit hash of the tag. docker/checkout.sh checks it after cloning, so a tag that
#                    was moved upstream fails the build; scripts/upstream.sh sync updates it.
#   A baseline can also be a bare commit hash when upstream has no tag for it: matrix-rust-sdk is pinned to
#   the commit the 26.10.15 binding releases (sdk-android, matrix-rust-components-swift) were built from,
#   which both apps use. matrix-rust-components-kotlin is the tool that packages it for Android.
#
